<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O Caminho · UNIDADE</title>
<meta name="description" content="Mini-jogo da UNIDADE MVT: desvie das distrações e chegue à Sala de Oração.">
<meta name="theme-color" content="#432064">
<style>
  html,body{margin:0;height:100%;background:#0c0718;overflow:hidden;overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:pointer;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="game" aria-label="Mini-jogo O Caminho: desvie das distrações e chegue à Sala de Oração"></canvas>
<script>
(() => {
// ============================================================
//  O CAMINHO — mini-jogo UNIDADE MVT (pixel art)
//  Parte 1: cena final (Sala de Oração), 1080x1920
// ============================================================
const W = 180, H = 320, CW = 1080, CH = 1920, DUR = 15;
const VW = 135, VH = 240, Z = 8;
const SHOW_DIALOG = false; // visible window of the buffer, scale

const cv = document.createElement('canvas');
cv.width = CW; cv.height = CH;
const ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');
const spr = document.createElement('canvas'); spr.width = 40; spr.height = 44;
const sg = spr.getContext('2d');
let G = g;

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, v) => { const u = clamp((v - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeOutBack = u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hash2(a, b) { return hash(a * 57.31 + b * 113.97); }
function R(x, y, w, h, c) { G.fillStyle = c; G.fillRect(Math.round(x), Math.round(y), w, h); }
function circ(cx, cy, r, c) {
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.round(Math.sqrt(r * r - dy * dy));
    R(cx - hw, cy + dy, hw * 2 + 1, 1, c);
  }
}
function glow(x, y, r, color, a) {
  const gr = G.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color.replace('A', a));
  gr.addColorStop(1, color.replace('A', 0));
  G.save(); G.globalCompositeOperation = 'lighter';
  G.fillStyle = gr; G.fillRect(x - r, y - r, r * 2, r * 2);
  G.restore();
}

// ---------- timeline ----------
const T_WALK = 3.05, T_FALL = 3.45, T_ACC = 4.2, T_CONST = 7.4, T_LAND = 8.4, T_LOGO = 9.3, T_TEXT = 10.8;
const GY = 232, HX = 124, ACC = 500;
const VMAX = ACC * (T_ACC - T_FALL);
const Y_ACC = GY + 0.5 * ACC * Math.pow(T_ACC - T_FALL, 2);
const Y_CONST = Y_ACC + VMAX * (T_CONST - T_ACC);
const DEC_D = VMAX * (T_LAND - T_CONST) / 3;
const F = Y_CONST + DEC_D;          // knees on floor (world y)
const CAMMAX = F - 268;            // boy ends at screen y 268
const CEIL = F - 248;              // room ceiling (screen y 20 at rest)
const WALLB = F - 18;              // back wall base

function boyY(t) {
  if (t < T_FALL) return GY;
  if (t < T_ACC) { const d = t - T_FALL; return GY + 0.5 * ACC * d * d; }
  if (t < T_CONST) return Y_ACC + VMAX * (t - T_ACC);
  if (t < T_LAND) return Y_CONST + DEC_D * easeOutCubic((t - T_CONST) / (T_LAND - T_CONST));
  return F;
}
function boyV(t) {
  if (t < T_FALL) return 0;
  if (t < T_ACC) return ACC * (t - T_FALL);
  if (t < T_CONST) return VMAX;
  if (t < T_LAND) { const u = (t - T_CONST) / (T_LAND - T_CONST); return VMAX * (1 - u) * (1 - u); }
  return 0;
}
const boyX = t => t < T_WALK ? HX * t / T_WALK : HX;
function camX(t) {
  if (t < T_FALL) return Math.min(boyX(t), HX) - 70;
  return lerp(HX - 70, HX - 90, sstep(T_FALL, T_FALL + 0.7, t));
}
function camY(t) {
  if (t < T_FALL) return 0;
  const tgt = lerp(GY, 140, sstep(T_FALL, T_FALL + 1.0, t));
  return clamp(boyY(t) - tgt, 0, CAMMAX);
}

// ---------- shaft geometry ----------
function shaftHW(wy) {
  const d = wy - GY;
  if (d < 6) return 8;
  let hw = lerp(8, 46, sstep(0, 170, d)) + Math.sin(wy * 0.045) * 4 + Math.sin(wy * 0.11 + 1) * 2;
  hw = lerp(hw, 11, sstep(CEIL - 230, CEIL - 40, wy));
  return hw;
}
function layer(d) {
  if (d < 2) return ['#e7e100', '#e7e100', '#fbf7a0'];
  if (d < 4) return ['#b3ae00', '#8f8b00', '#d1cc00'];
  if (d < 10) return ['#3a3a3a', '#2e2e2e', '#4f4f4f'];
  if (d < 70) return ['#2b2430', '#211b26', '#3d3346'];
  if (d < 220) return ['#241d2d', '#1a1520', '#352a42'];
  if (d < 480) return ['#221735', '#181026', '#3a2758'];
  return ['#1b1030', '#120a22', '#3a1f66'];
}

// ---------- SURFACE ----------
// UNIDADE palette: yellow #e7e100 · violet #a83cf8 · deep violet #432064 · ink #191919 · paper #fdfdfd
const SKY = ['#120c1c', '#1c1230', '#2a1745', '#432064', '#55267f', '#6a2c9e', '#8034c4', '#a83cf8', '#bb67fa', '#cf95f6', '#e0c4d8', '#efe9a0'];
function rgbOf(hex) { const n = parseInt(hex.slice(1), 16); return `${n >> 16},${(n >> 8) & 255},${n & 255}`; }
function drawSurface(t, cx, cy) {
  const horizon = 214;
  const bh = horizon / SKY.length;
  for (let y = 0; y < horizon; y++) {
    const sy = y - cy; if (sy < 0) continue; if (sy >= H) break;
    const f = y / bh; const i = Math.floor(f); const fr = f - i;
    R(0, sy, W, 1, SKY[i]);
    if (fr > 0.7 && i < SKY.length - 1) {
      G.fillStyle = SKY[i + 1];
      const step = fr > 0.85 ? 2 : 4;
      for (let x = (y & 1) * (step / 2); x < W; x += step) G.fillRect(x, sy, 1, 1);
    }
  }
  // stars
  for (let i = 0; i < 46; i++) {
    const x = Math.floor(hash(i) * W), y = Math.floor(hash(i + 100) * 95);
    const tw = Math.sin(t * (2 + hash(i + 7) * 4) + i) > 0.2;
    if (tw) R(x, y - cy, 1, 1, hash(i + 3) > 0.5 ? '#ffffff' : '#e7e100');
  }
  // sun
  const sunX = Math.round(128 - cx * 0.03), sunY = 184 - cy, r = 30;
  G.save(); G.globalCompositeOperation = 'lighter';
  const sg2 = G.createRadialGradient(sunX, sunY, 4, sunX, sunY, 80);
  sg2.addColorStop(0, 'rgba(231,225,0,0.45)'); sg2.addColorStop(1, 'rgba(168,60,248,0)');
  G.fillStyle = sg2; G.fillRect(sunX - 80, sunY - 80, 160, 160);
  G.restore();
  for (let dy = -r; dy <= r; dy++) {
    const wy = 184 + dy; if (wy > horizon) break;
    if (dy > 2 && (dy % 7) < 1 + (dy / 10)) continue;
    const hw = Math.round(Math.sqrt(r * r - dy * dy));
    const u = (dy + r) / (2 * r);
    R(sunX - hw, sunY + dy, hw * 2 + 1, 1, u < 0.35 ? '#fbf7a0' : u < 0.6 ? '#e7e100' : '#cfc800');
  }
  // clouds
  for (let i = 0; i < 6; i++) {
    let x = ((hash(i) * 320 - cx * 0.15 + t * 3) % 360 + 360) % 360 - 60;
    const y = 30 + hash(i + 7) * 120 - cy;
    const s = 0.7 + hash(i + 9) * 0.7;
    const w = Math.round(30 * s);
    R(x + 2, y + 5, w - 4, 2, '#7a35b8');
    R(x, y, w, 5, '#d3a6ff');
    R(x + w * 0.2, y - 3, w * 0.5, 3, '#d3a6ff');
    R(x + w * 0.32, y - 5, w * 0.26, 2, '#f1e4ff');
    R(x + 2, y, w * 0.5, 1, '#f1e4ff');
  }
  // far mountains
  for (let x = 0; x < W; x++) {
    const wx = x + cx * 0.25;
    const hgt = 24 + 10 * Math.sin(wx * 0.035) + 6 * Math.sin(wx * 0.09 + 1) + 3 * Math.sin(wx * 0.23);
    const top = Math.round(212 - hgt);
    R(x, top - cy, 1, GY - top, '#432064');
    R(x, top - cy, 1, 1, '#7a35b8');
  }
  // mid hills
  for (let x = 0; x < W; x++) {
    const wx = x + cx * 0.5;
    const hgt = 12 + 6 * Math.sin(wx * 0.05 + 2) + 3 * Math.sin(wx * 0.13);
    const top = Math.round(224 - hgt);
    R(x, top - cy, 1, GY - top, '#2a1740');
    R(x, top - cy, 1, 1, '#55267f');
  }
  // trees
  for (let i = -2; i < 40; i++) {
    const tx = Math.round(i * 19 + hash(i) * 8 - cx * 0.72);
    if (tx < -15 || tx > W + 15) continue;
    const rr = 6 + Math.floor(hash(i + 4) * 4);
    const base = 229 - cy;
    R(tx - 1, base - 6, 2, 6, '#191919');
    circ(tx, base - 6 - rr, rr, '#1e1528');
    circ(tx + 1, base - 7 - rr, rr - 2, '#2e1f42');
    R(tx + 1, base - 6 - rr * 2 + 2, 3, 2, '#55267f');
  }
  // fence
  for (let i = -3; i < 30; i++) {
    const fx = Math.round(i * 16 - cx);
    if (fx < -16 || fx > W) continue;
    if (Math.abs(i * 16 - HX) < 18) continue;
    R(fx, GY - 8 - cy, 2, 8, '#232323');
    R(fx, GY - 8 - cy, 2, 1, '#4a4a4a');
    R(fx, GY - 6 - cy, 16, 1, '#2e2e2e');
  }
  // signpost
  const sx = Math.round(46 - cx);
  R(sx, GY - 16 - cy, 2, 16, '#191919');
  R(sx - 6, GY - 17 - cy, 15, 6, '#e7e100');
  R(sx - 6, GY - 17 - cy, 15, 1, '#fbf7a0');
  R(sx - 3, GY - 15 - cy, 7, 1, '#191919'); R(sx + 2, GY - 16 - cy, 1, 3, '#191919'); R(sx + 3, GY - 15 - cy, 1, 1, '#191919');
  // tufts + flowers
  for (let i = -5; i < 60; i++) {
    const wx = i * 7 + Math.floor(hash(i + 50) * 5);
    if (Math.abs(wx - HX) < 11) continue;
    const x = wx - cx; if (x < -2 || x > W) continue;
    R(x, GY - 1 - cy, 1, 1, '#fbf7a0');
    if (hash(i + 77) > 0.6) R(x + 2, GY - 2 - cy, 1, 1, hash(i) > 0.5 ? '#a83cf8' : '#ffffff');
  }
}

// ---------- UNDERGROUND / SHAFT ----------
function drawUnder(t, cx, cy) {
  const c = HX - cx;
  const y0 = Math.max(0, Math.floor(GY - cy));
  const y1 = Math.min(H, Math.floor(CEIL - 6 - cy));
  for (let sy = y0; sy < y1; sy++) {
    const wy = sy + cy, d = wy - GY;
    const hw = shaftHW(wy);
    const L = Math.round(c - hw), Rr = Math.round(c + hw);
    const lc = layer(d);
    R(0, sy, Math.max(0, L), 1, lc[0]);
    R(Rr, sy, W - Rr, 1, lc[0]);
    const deep = sstep(80, 900, d);
    const inner = deep < 0.33 ? '#0a0612' : deep < 0.66 ? '#0f0920' : '#140b2a';
    R(L, sy, Rr - L, 1, inner);
    R(L - 1, sy, 1, 1, lc[2]); R(Rr, sy, 1, 1, lc[2]);
    R(L, sy, 1, 1, '#05030a'); R(Rr - 1, sy, 1, 1, '#05030a');
  }
  if (y1 <= y0) return;
  // keep the cave hidden until he falls (only a shallow pit shows)
  const cover = 1 - sstep(T_FALL - 0.05, T_FALL + 0.3, t);
  if (cover > 0) {
    G.save(); G.globalAlpha = cover;
    for (let sy = Math.max(y0, Math.floor(GY + 12 - cy)); sy < y1; sy++) {
      const d = sy + cy - GY;
      R(0, sy, W, 1, layer(d)[0]);
    }
    const pitTop = GY + 10 - cy;
    R(c - 8, pitTop, 16, 2, '#05030a');
    G.restore();
  }
  // stones + crystals
  const cx0 = Math.floor(cx / 8) - 1, cx1 = Math.floor((cx + W) / 8) + 1;
  const cy0 = Math.floor((cy + y0) / 6) - 1, cy1 = Math.floor((cy + y1) / 6) + 1;
  for (let j = cy0; j <= cy1; j++) {
    for (let i = cx0; i <= cx1; i++) {
      const h = hash2(i, j);
      const wx = i * 8 + Math.floor(hash2(j, i) * 5), wy = j * 6;
      const d = wy - GY;
      if (d < 12 || wy > CEIL - 8) continue;
      const hw = shaftHW(wy);
      const off = Math.abs(wx - HX) - hw;
      if (off < 2) continue;
      const sx = wx - cx, sy = wy - cy;
      if (sy < y0 - 3 || sy > y1) continue;
      const lc = layer(d);
      if (h < 0.32) { R(sx, sy, 3, 2, lc[1]); R(sx, sy, 2, 1, lc[2]); }
      if (d > 280 && h > 0.9 && off < 16) {
        const col = ['#a83cf8', '#e7e100', '#c98bff'][Math.floor(hash2(i + 3, j) * 3)];
        R(sx, sy - 2, 1, 5, col); R(sx - 1, sy - 1, 3, 3, col); R(sx, sy - 1, 1, 1, '#ffffff');
        const pulse = 0.25 + 0.15 * Math.sin(t * 3 + i + j);
        glow(sx, sy, 7, `rgba(${rgbOf(col)},A)`, pulse);
      }
    }
  }
  // warm light rising from the room below
  const ceilS = CEIL - cy;
  if (ceilS < H + 360) {
    const top = ceilS - 340;
    const gr = G.createLinearGradient(0, top, 0, ceilS);
    gr.addColorStop(0, 'rgba(231,225,0,0)');
    gr.addColorStop(1, 'rgba(240,236,140,0.45)');
    G.save(); G.globalCompositeOperation = 'lighter';
    G.fillStyle = gr; G.fillRect(0, Math.max(0, top), W, Math.min(H, ceilS) - Math.max(0, top));
    G.restore();
  }
}

// ---------- ROOM ----------
function roomLight(t) { return 0.28 + 0.72 * sstep(T_LAND, T_LAND + 1.2, t); }
function drawRoom(t, cx, cy) {
  const top = CEIL - 6 - cy; if (top >= H) return;
  const c = HX - cx;
  const ceil = CEIL - cy, wb = WALLB - cy, fy = F - cy;
  // back wall planks
  for (let x = 0; x < W; x += 10) {
    const pi = Math.floor((x + cx) / 10);
    R(x, ceil, 10, wb - ceil, pi % 2 ? '#3d1d5c' : '#361a52');
    R(x, ceil, 1, wb - ceil, '#26123c');
    for (let k = 0; k < 3; k++) {
      const ny = ceil + 10 + hash2(pi, k) * (wb - ceil - 30);
      R(x + 3 + Math.floor(hash2(k, pi) * 5), ny, 1, 2, '#2c1546');
    }
  }
  // wainscot
  R(0, wb - 22, W, 22, '#191919');
  R(0, wb - 22, W, 1, '#e7e100');
  R(0, wb - 21, W, 1, '#432064');
  for (let x = 4; x < W; x += 22) { R(x, wb - 17, 16, 13, '#232323'); R(x, wb - 17, 16, 1, '#111111'); }
  // floor
  for (let y = wb; y < H; y++) {
    const k = y - wb;
    R(0, y, W, 1, (Math.floor(k / 7) % 2) ? '#2b2b2b' : '#262626');
    if (k % 7 === 0) R(0, y, W, 1, '#191919');
  }
  for (let r = 0; r < 12; r++) {
    const yy = wb + r * 7;
    for (let x = (r % 2) * 17; x < W; x += 34) R(x, yy, 1, 7, '#191919');
  }
  // rug
  R(c - 42, fy - 9, 84, 18, '#e7e100');
  R(c - 40, fy - 8, 80, 16, '#432064');
  R(c - 37, fy - 6, 74, 12, '#5a2687');
  for (let x = c - 34; x < c + 34; x += 6) { R(x, fy - 3, 2, 2, '#a83cf8'); R(x + 3, fy + 1, 2, 2, '#e7e100'); }
  for (let x = c - 44; x < c + 44; x += 3) { R(x, fy + 9, 1, 2, '#fbf7a0'); R(x, fy - 11, 1, 2, '#fbf7a0'); }
  // altar table (right)
  const ax = c + 26;
  R(ax + 2, fy - 22, 2, 14, '#111111'); R(ax + 26, fy - 22, 2, 14, '#111111');
  R(ax, fy - 32, 30, 11, '#fdfdfd'); R(ax, fy - 32, 30, 1, '#ffffff');
  R(ax + 13, fy - 32, 4, 11, '#a83cf8');
  R(ax, fy - 22, 30, 1, '#dadada');
  // open book
  R(ax + 3, fy - 35, 12, 3, '#f4f3ee'); R(ax + 8, fy - 35, 1, 3, '#b8b8b8');
  R(ax + 2, fy - 33, 14, 1, '#432064');
  R(ax + 4, fy - 34, 3, 1, '#b8b8b8'); R(ax + 10, fy - 34, 3, 1, '#b8b8b8');
  // standing cross
  R(ax + 20, fy - 50, 2, 18, '#e7e100'); R(ax + 17, fy - 46, 8, 2, '#e7e100');
  R(ax + 20, fy - 50, 1, 18, '#fbf7a0');
  R(ax + 18, fy - 33, 6, 1, '#b3ae00');
  // candle stand (left)
  const lx = c - 60;
  R(lx, fy - 38, 2, 30, '#111111'); R(lx - 3, fy - 9, 8, 2, '#111111');
  R(lx - 3, fy - 39, 8, 2, '#e7e100');
  R(lx - 1, fy - 47, 4, 8, '#f4f3ee'); R(lx - 1, fy - 47, 1, 8, '#ffffff');
  // altar candle
  R(ax + 26, fy - 39, 3, 7, '#f4f3ee');
  // ceiling slab with hole
  R(0, top, Math.max(0, c - 11), 6, '#191919');
  R(c + 11, top, W - (c + 11), 6, '#191919');
  R(0, top + 5, Math.max(0, c - 11), 1, '#432064');
  R(c + 11, top + 5, W - (c + 11), 1, '#432064');
  for (let x = 6; x < W; x += 30) if (Math.abs(x - c) > 16) R(x, ceil, 3, 4, '#191919');

  // darkness
  const Lt = roomLight(t);
  G.fillStyle = `rgba(12,6,22,${(0.82 * (1 - Lt)).toFixed(3)})`;
  G.fillRect(0, ceil, W, H - ceil);
  // violet ambient once lit
  G.save(); G.globalCompositeOperation = 'lighter';
  G.fillStyle = `rgba(168,60,248,${(0.10 * Lt).toFixed(3)})`;
  G.fillRect(0, ceil, W, H - ceil);
  G.restore();

  // flames
  const fl = (k) => Math.round(Math.sin(t * 13 + k) * 0.6 + Math.sin(t * 7.3 + k * 2) * 0.6);
  const flame = (x, y, k) => {
    R(x, y - 4 + fl(k), 2, 4, '#ffb347'); R(x, y - 3, 2, 2, '#fff2b0'); R(x, y - 5 + fl(k), 1, 1, '#ffd36b');
    glow(x + 1, y - 2, 18, 'rgba(255,170,80,A)', 0.35 + 0.08 * Math.sin(t * 9 + k));
  };
  flame(lx, fy - 47, 1);
  flame(ax + 26, fy - 39, 2);

  // light beam from ceiling hole
  const beamA = 0.10 + 0.12 * sstep(T_LAND - 0.2, T_LAND + 0.8, t);
  G.save(); G.globalCompositeOperation = 'lighter';
  for (let y = Math.max(0, ceil); y < Math.min(H, fy + 8); y++) {
    const u = (y - ceil) / (fy + 8 - ceil);
    const hw = lerp(10, 30, u);
    const band = 0.75 + 0.25 * Math.sin(y * 0.35 - t * 4);
    G.fillStyle = `rgba(240,236,130,${(beamA * band * (1 - u * 0.4)).toFixed(3)})`;
    G.fillRect(Math.round(c - hw), y, Math.round(hw * 2), 1);
    G.fillStyle = `rgba(255,253,210,${(beamA * 0.9).toFixed(3)})`;
    G.fillRect(Math.round(c - hw * 0.35), y, Math.round(hw * 0.7), 1);
  }
  G.restore();
  // dust motes in room
  for (let i = 0; i < 34; i++) {
    const x = c + (hash(i + 400) - 0.5) * 170 + Math.sin(t * 0.8 + i) * 3;
    const y = fy + 30 - ((t * (6 + hash(i + 401) * 8) + hash(i + 402) * 300) % 300);
    if (y < ceil || y > H) continue;
    const a = 0.3 + 0.5 * Lt * (0.5 + 0.5 * Math.sin(t * 5 + i));
    G.fillStyle = i % 3 ? `rgba(250,245,170,${a.toFixed(2)})` : `rgba(201,139,255,${a.toFixed(2)})`;
    G.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
}

// ---------- MOTES IN SHAFT ----------
const MOTE = ['#e7e100', '#a83cf8', '#ffffff', '#c98bff', '#fbf7a0', '#e7e100'];
function drawMotes(t, cx, cy) {
  const c = HX - cx;
  const v = boyV(t);
  const streak = 1 + Math.round(Math.min(11, v * 0.028));
  const reveal = sstep(T_FALL, T_FALL + 0.4, t);
  if (reveal <= 0) return;
  const s0 = Math.floor(cy / 22) - 2, s1 = Math.floor((cy + H) / 22) + 2;
  G.save();
  for (let s = s0; s <= s1; s++) {
    for (let k = 0; k < 4; k++) {
      const id = s * 4 + k;
      let wy = s * 22 + hash(id + 0.5) * 22 - (t * 16 + hash(id + 0.3) * 12);
      const d = wy - GY;
      if (d < 50 || wy > CEIL - 10) continue;
      if (k === 3 && d < 400) continue;
      const hw = shaftHW(wy) - 3;

function sparkle(x, y, s, a, col) {
  ctx.globalAlpha = a; ctx.fillStyle = col;
  ctx.fillRect(x - s * 3, y - s / 2, s * 7, s);
  ctx.fillRect(x - s / 2, y - s * 3, s, s * 7);

// ---------- OVERLAYS (full-res) ----------
function drawOverlays(t) {
  // RPG dialog box
  if (SHOW_DIALOG && t > 0.25 && t < 2.95) {
    const inU = sstep(0.25, 0.45, t), outU = 1 - sstep(2.7, 2.95, t);
    const k = inU * outU;
    const bx = 60, bw = 960, bh = 190, by = 150;
    const hh = Math.round(bh * k);
    const yy = by + (bh - hh) / 2;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(bx, yy, bw, hh);
    if (hh > 24) {
      ctx.fillStyle = INK; ctx.fillRect(bx + 12, yy + 12, bw - 24, hh - 24);
      ctx.fillStyle = '#a83cf8'; ctx.fillRect(bx + 18, yy + 18, bw - 36, 6);
    }
    if (k > 0.98) {
      const msg = '* SEGUINDO O MEU CAMINHO...';
      const n = clamp(Math.floor((t - 0.5) * 20), 0, msg.length);
      drawText(ctx, msg.slice(0, n), bx + 60, by + 78, 5, WHITE, null);
      if (n === msg.length && Math.floor(t * 4) % 2 === 0) {
        ctx.fillStyle = '#e7e100';
        ctx.fillRect(bx + bw - 80, by + bh - 62, 30, 6); ctx.fillRect(bx + bw - 74, by + bh - 56, 18, 6); ctx.fillRect(bx + bw - 68, by + bh - 50, 6, 6);
      }
    }
  }
  // landing flash
  if (t >= T_LAND && t < T_LAND + 0.45) {
    const u = (t - T_LAND) / 0.45;
    ctx.fillStyle = `rgba(253,253,240,${(0.75 * (1 - u)).toFixed(3)})`;
    ctx.fillRect(0, 0, CW, CH);
  }
  // darken top for titles
  const dk = sstep(T_LOGO - 0.4, T_LOGO + 0.6, t);
  if (dk > 0) {
    const gr = ctx.createLinearGradient(0, 0, 0, 1420);
    gr.addColorStop(0, `rgba(18,10,30,${(0.8 * dk).toFixed(3)})`);
    gr.addColorStop(0.75, `rgba(18,10,30,${(0.55 * dk).toFixed(3)})`);
    gr.addColorStop(1, 'rgba(18,10,30,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, CW, 1420);
  }
  // logo rises
  if (t >= T_LOGO) {
    const u = clamp((t - T_LOGO) / 1.05, 0, 1);
    const yOff = Math.round((1 - easeOutBack(u)) * 1500);
    const ly = 165 + yOff;
    const a = sstep(0, 0.25, u);
    ctx.globalAlpha = a;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * (0.55 + 0.25 * Math.sin(t * 3));
    ctx.drawImage(logoGlow, 0, ly);
    ctx.restore();
    ctx.globalAlpha = a;
    ctx.drawImage(logoImg, 0, ly);
    ctx.globalAlpha = 1;
    // violet asterisks beside "SALA DE" (UNIDADE sparkle)
    if (u > 0.6) {
      const dy = ly + 140 + 45;
      const sw = textW('SALA DE', 13);
      [-1, 1].forEach(sgn => {
        const x = Math.round(CW / 2 + sgn * (sw / 2 + 80));
        const q = 7, sp = Math.sin(t * 4 + sgn) > 0 ? 0 : q;
        ctx.fillStyle = '#a83cf8';
        ctx.fillRect(x - q / 2, dy - 4 * q - sp / 2, q, 8 * q + sp);
        ctx.fillRect(x - 4 * q - sp / 2, dy - q / 2, 8 * q + sp, q);
        for (let k = 1; k <= 3; k++) {
          ctx.fillRect(x - q / 2 + k * q, dy - q / 2 - k * q, q, q); ctx.fillRect(x - q / 2 - k * q, dy - q / 2 + k * q, q, q);
          ctx.fillRect(x - q / 2 - k * q, dy - q / 2 - k * q, q, q); ctx.fillRect(x - q / 2 + k * q, dy - q / 2 + k * q, q, q);
        }
      });
    }
    // arrival burst
    const bu = (t - (T_LOGO + 0.75)) / 0.9;
    if (bu > 0 && bu < 1) {
      for (let i = 0; i < 16; i++) {
        const ang = i / 16 * Math.PI * 2 + 0.2;
        const rr = 150 + easeOutCubic(bu) * 380;
        const x = CW / 2 + Math.cos(ang) * rr * 1.25, y = ly + 290 + Math.sin(ang) * rr * 0.55;
        sparkle(Math.round(x), Math.round(y), 8, 1 - bu, i % 2 ? '#e7e100' : '#c98bff');
      }
    }
    // twinkles
    if (u >= 1) {
      for (let i = 0; i < 6; i++) {
        const ph = (t * 1.3 + hash(i + 300)) % 1;
        const x = 140 + hash(i + 301 + Math.floor(t * 1.3 + hash(i + 300))) * 800;
        const y = ly + 180 + hash(i + 302 + Math.floor(t * 1.3 + hash(i + 300))) * 240;
        sparkle(Math.round(x), Math.round(y), 6, Math.sin(ph * Math.PI), '#ffffff');
      }
    }
  }
  // phrase
  PHRASE.forEach((l, i) => {
    if (t < l.t0) return;
    const x = Math.round((CW - textW(l.s, l.p)) / 2);
    if (!l.pop) {
      const n = clamp(Math.floor((t - l.t0) * CPS) + 1, 0, l.s.length);
      drawText(ctx, l.s.slice(0, n), x, l.y, l.p, l.pal, INK);
    } else {
      const u = clamp((t - l.t0) / 0.35, 0, 1);
      const sc = lerp(1.7, 1, easeOutBack(u));
      const a = sstep(0, 0.4, u);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a * (0.6 + 0.3 * Math.sin(t * 4));
      ctx.drawImage(lastGlow, 0, l.y - 80);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(CW / 2, l.y + 3.5 * l.p);
      ctx.scale(sc, sc);
      ctx.translate(-CW / 2, -(l.y + 3.5 * l.p));
      drawText(ctx, l.s, x, l.y, l.p, l.pal, INK);
      ctx.restore();
      // flash ring
      const fu = (t - l.t0) / 0.7;
      if (fu > 0 && fu < 1) {
        for (let k = 0; k < 10; k++) {
          const ang = k / 10 * Math.PI * 2;
          const rr = 60 + easeOutCubic(fu) * 420;
          sparkle(Math.round(CW / 2 + Math.cos(ang) * rr), Math.round(l.y + 42 + Math.sin(ang) * rr * 0.35), 7, 1 - fu, k % 2 ? '#e7e100' : '#c98bff');
        }

  // vignette
  const vg = ctx.createRadialGradient(CW / 2, CH / 2, CH * 0.32, CW / 2, CH / 2, CH * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, CW, CH);
  // final fade-in of the very first frame
  if (t < 0.25) { ctx.fillStyle = `rgba(0,0,0,${(1 - t / 0.25).toFixed(3)})`; ctx.fillRect(0, 0, CW, CH); }
}

function render(t) {

  drawUnder(t, cx, cy);

  drawMotes(t, cx, cy);

  drawFX(t, cx, cy);
  ctx.imageSmoothingEnabled = false;
  let dx = 0, dy = 0;
  if (t >= T_LAND && t < T_LAND + 0.3) {
    const m = 2 * (1 - (t - T_LAND) / 0.3);
    dx = Math.round((hash(Math.floor(t * 60)) * 2 - 1) * m);
    dy = Math.round((hash(Math.floor(t * 60) + 9) * 2 - 1) * m);
  }

  const bxs = boyX(t) - cx, bys = boyY(t) - cy;
  const fp = sstep(T_FALL, T_FALL + 1, t);
  const x0 = Math.round(clamp(bxs - 67, 0, W - VW));
  const y0 = Math.round(clamp(bys - lerp(168, 100, fp), 0, H - VH));
  ctx.fillStyle = '#07040d'; ctx.fillRect(0, 0, CW, CH);
  ctx.drawImage(buf, x0, y0, VW, VH, dx * Z, dy * Z, CW, CH);
  drawOverlays(t);
}

const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function buildAudio(ac, out, t0, skip = 0) {
  const master = ac.createGain(); master.gain.value = 0.55;
  const comp = ac.createDynamicsCompressor();
  master.connect(comp); comp.connect(out);
  const delay = ac.createDelay(1); delay.delayTime.value = 0.27;
  const fb = ac.createGain(); fb.gain.value = 0.38;
  const wet = ac.createGain(); wet.gain.value = 0.4;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const nd = nb.getChannelData(0); let seed = 12345;
  for (let i = 0; i < nd.length; i++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; nd[i] = seed / 0x3fffffff - 1; }

  function env(gn, st, dur, vol, a, r) {
    const T = t0 + st;
    gn.gain.setValueAtTime(0, T);
    gn.gain.linearRampToValueAtTime(vol, T + a);
    gn.gain.setValueAtTime(vol, T + Math.max(a, dur - r));
    gn.gain.linearRampToValueAtTime(0, T + dur);
  }
  function tone(type, f, st, dur, vol, o = {}) {
    if (st < skip) return;
    const osc = ac.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(f, t0 + st);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + st + (o.slide || dur));
    if (o.vib) {
      const lfo = ac.createOscillator(); lfo.frequency.value = 5.5;
      const lg = ac.createGain(); lg.gain.value = f * 0.006;
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t0 + st); lfo.stop(t0 + st + dur + 0.1);
    }
    const gn = ac.createGain();
    env(gn, st, dur, vol, o.a || 0.004, o.r || 0.04);
    osc.connect(gn); gn.connect(master);
    if (o.echo) gn.connect(delay);
    osc.start(t0 + st); osc.stop(t0 + st + dur + 0.05);
  }
  function noise(st, dur, vol, type, f0, f1, o = {}) {
    if (st < skip) return;
    const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = o.q || 1;
    fl.frequency.setValueAtTime(f0, t0 + st);
    if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t0 + st + dur);
    const gn = ac.createGain();
    env(gn, st, dur, vol, o.a || 0.005, o.r || 0.05);
    src.connect(fl); fl.connect(gn); gn.connect(master);
    src.start(t0 + st, (st * 0.37) % 1.5); src.stop(t0 + st + dur + 0.05);
  }

  // overworld tune (0 – 3.0)
  const e8 = 0.1875;
  const mel = [76, 79, 81, 79, 76, 74, 72, 74, 76, 79, 84, 83, 81, 79, 81, 83];
  mel.forEach((m, i) => tone('square', mf(m), 0.12 + i * e8, e8 * 0.9, 0.06, { r: 0.03 }));
  [48, 55, 57, 53, 48, 55, 57, 55].forEach((m, i) => tone('triangle', mf(m), 0.12 + i * e8 * 2, e8 * 1.8, 0.16));
  // footsteps
  for (let tt = 0.12; tt < T_WALK; tt += 1 / 4.4) noise(tt, 0.05, 0.08, 'lowpass', 900, null);
  // dialog blips
  const msg = '* SEGUINDO O MEU CAMINHO...';
  for (let i = 0; i < msg.length; i++) if (msg[i] !== ' ') tone('square', 740 + (i % 3) * 60, 0.5 + i / 20, 0.025, 0.03);
  // "!" sting
  tone('square', mf(83), T_WALK, 0.08, 0.08);
  tone('square', mf(88), T_WALK + 0.09, 0.18, 0.08);
  // fall slide + wind
  tone('square', 1100, T_FALL, 0.95, 0.07, { to: 80 });
  tone('triangle', 600, T_FALL, 0.95, 0.08, { to: 60 });
  noise(T_FALL, T_CONST + 0.3 - T_FALL, 0.16, 'bandpass', 350, 1500, { a: 0.6, r: 0.8, q: 0.8 });
  noise(T_ACC, T_CONST - T_ACC, 0.05, 'highpass', 3000, null, { a: 0.5, r: 0.6 });
  // sparkle tinkles in the deep
  const penta = [84, 86, 88, 91, 93, 96, 98, 100];
  let k = 0;
  for (let tt = T_ACC - 0.2; tt < T_CONST + 0.1; tt += 0.105) {
    const m = penta[Math.floor(hash(k + 500) * penta.length)];
    tone('triangle', mf(m), tt, 0.1, 0.035 + 0.02 * hash(k + 501), { echo: true });
    k++;
  }
  // heavenly pad as light approaches
  [48, 60, 64, 67, 71, 74].forEach((m, i) => tone(i === 0 ? 'triangle' : 'sine', mf(m), 6.5, 3.2, i === 0 ? 0.1 : 0.045, { a: 1.3, r: 1.2, vib: i > 0 }));
  // landing
  tone('sine', 150, T_LAND, 0.4, 0.5, { to: 40 });
  noise(T_LAND, 0.35, 0.22, 'lowpass', 500, 120);
  [84, 88, 91, 96, 100].forEach((m, i) => tone('triangle', mf(m), T_LAND + 0.05 + i * 0.055, 0.25, 0.05, { echo: true }));
  // logo whoosh + fanfare
  noise(T_LOGO, 0.85, 0.07, 'bandpass', 300, 3500, { a: 0.6, r: 0.1, q: 2 });
  const arr = T_LOGO + 0.75;
  [72, 76, 79].forEach((m, i) => tone('square', mf(m), arr - 0.3 + i * 0.08, 0.1, 0.05));
  [72, 76, 79, 84].forEach(m => tone('square', mf(m), arr, 1.0, 0.04, { r: 0.4, vib: true }));
  tone('triangle', mf(48), arr, 1.2, 0.18, { r: 0.5 });
  [96, 100, 103, 108].forEach((m, i) => tone('triangle', mf(m), arr + 0.08 + i * 0.05, 0.18, 0.04, { echo: true }));
  // typing blips
  PHRASE.forEach(l => {
    if (l.pop) return;
    for (let i = 0; i < l.s.length; i++) if (l.s[i] !== ' ') tone('square', 1046 + (i % 2) * 130, l.t0 + i / CPS, 0.022, 0.025);
  });
  // amen: F -> C
  const pt = PHRASE[3].t0;
  [53, 57, 60, 65, 69].forEach(m => tone('triangle', mf(m), pt - 1.25, 1.35, 0.045, { a: 0.3, r: 0.4 }));
  [48, 55, 60, 64, 67, 72].forEach((m, i) => tone(i < 2 ? 'triangle' : 'square', mf(m), pt, DUR - pt, i < 2 ? 0.1 : 0.03, { a: 0.02, r: 1.1, vib: i >= 2 }));
  [84, 88, 91, 96, 100, 103].forEach((m, i) => tone('triangle', mf(m), pt + 0.02 + i * 0.06, 0.3, 0.045, { echo: true }));
  return master;
}

  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  ws(36, 'data'); dv.setUint32(40, n * 4, true);
  for (let i = 0; i < n; i++) {
    dv.setInt16(44 + i * 4, clamp(L[i], -1, 1) * 32767, true);
    dv.setInt16(46 + i * 4, clamp(Rr[i], -1, 1) * 32767, true);
  }

  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

const rnd = Math.random;

// ---------- update ----------

  if (!P.ground) {

// ---------- world drawing ----------
function gBands(cols, h) {
  const bh = h / cols.length;
  for (let y = 0; y < h; y++) {
    const f = y / bh, i = Math.min(cols.length - 1, Math.floor(f)), fr = f - i;
    R(0, y, GW, 1, cols[i]);
    if (fr > 0.7 && i < cols.length - 1) {
      G.fillStyle = cols[i + 1];
      const step = fr > 0.85 ? 2 : 4;
      for (let x = (y & 1) * (step / 2); x < GW; x += step) G.fillRect(x, y, 1, 1);
    }
  }
}
function layerDraw(L, off, t, k) {
  if (!L) return;

    for (let x = 0; x < GW; x++) {
      const wx = x + off;
      const n = L.type === 'mount'
        ? 0.6 + 0.25 * Math.sin(wx * 0.035 + k) + 0.1 * Math.sin(wx * 0.09 + 1) + 0.05 * Math.sin(wx * 0.23)
        : 0.6 + 0.3 * Math.sin(wx * 0.05 + 2) + 0.1 * Math.sin(wx * 0.13);
      const top = Math.round(GGY - L.h * n);

    }
  } else {
    const slot = 15, i0 = Math.floor(off / slot) - 1, i1 = i0 + Math.ceil(GW / slot) + 2;
    for (let i = i0; i <= i1; i++) {
      const seed = i * 3.17 + k * 51;
      const w = 10 + Math.floor(hash(seed) * 5), hgt = Math.round(L.h * (0.35 + 0.65 * hash(seed + 1.3)));
      const x = Math.round(i * slot - off), top = GGY - hgt;
      R(x, top, w, hgt, L.col);
      if (hash(seed + 2.2) > 0.6) R(x + 2, top - 3, 1, 3, L.col);
      for (let wy = top + 3; wy < GGY - 3; wy += 5) for (let wx = 2; wx < w - 2; wx += 4) {
        let lit = hash(seed + wy * 0.37 + wx * 0.11) > 0.5;
        if (L.flicker && hash(seed + wy + wx * 1.7) > 0.93) lit = Math.sin(t * 2 + wx + wy) > 0;

    const x = Math.floor(hash(i + 3.3) * GW), y = Math.floor(hash(i + 103.1) * GGY * 0.55);
    if (Math.sin(t * (1.5 + hash(i + 7) * 3) + i) > 0.1) R(x, y, 1, 1, hash(i + 9) > 0.75 ? '#e7e100' : '#ffffff');
  }

    glow(sx, sy, r * 3, 'rgba(231,225,0,A)', 0.35);
    for (let dy = -r; dy <= r; dy++) {
      if (th.sun.stripes && dy > 2 && (dy % 6) < 1 + dy / 9) continue;
      const hw = Math.round(Math.sqrt(r * r - dy * dy)), u = (dy + r) / (2 * r);

    }
  }
  if (th.moon) {
    const mx = Math.round(GW * th.moon.x), my = Math.round(GGY * th.moon.y), r = th.moon.r;
    glow(mx, my, r * 3, 'rgba(251,247,160,A)', 0.25);
    circ(mx, my, r, '#fbf7a0');

  }
  if (th.clouds) for (let i = 0; i < 5; i++) {

  ['facil', 'medio', 'dificil'].forEach(id => { const r = addBtn(id, DIFF[id].name, SW / 2, y + bp * 6.5, bp, { minW, primary: id === diff }); y += r.h + UP * 4; });
  const hid = hotId && DIFF[hotId] ? hotId : diff;
  const rec = 'RECORDE ' + DIFF[hid].name + ': ' + BEST[hid];
  y += UP * 2;
  TC(rec, y, Math.max(1, Math.round(UP * 0.8)), GOLD);
  const hp = fitP('ESPAÇO = PULAR    ↓ = ABAIXAR', SW * 0.9, UP * 0.8);
  const hint = TOUCH ? 'TOQUE = PULAR    ↓ = ABAIXAR' : 'ESPAÇO = PULAR    ↓ = ABAIXAR';
  TC(hint, SH - UP * 7 - 7 * hp * 2.6, hp, WHITE);
  TC('UNIDADE MVT - VILA VELHA, ES', SH - UP * 4 - 7 * hp, hp, LILAC);
  addBtn('sound', muted ? 'SOM: NÃO' : 'SOM: SIM', SW - UP * 4 - (textW('SOM: NÃO', UP) + UP * 10) / 2, UP * 4 + UP * 6.5, UP, { nav: false, minW: textW('SOM: NÃO', UP) + UP * 10 });
}
function drawUI() {
  const p = UP;
  if (state === 'menu') { drawMenu(); return; }
  if (['intro', 'play', 'clear', 'pause', 'over', 'finaleFade'].includes(state)) drawHUD();
  if (['intro', 'play', 'clear'].includes(state)) drawTouch();
  if (state === 'intro') {
    const L = LEVELS[lvl];
    const a = stateT < 0.25 ? stateT / 0.25 : stateT > 2.3 ? clamp((2.6 - stateT) / 0.3, 0, 1) : 1;
    sc.globalAlpha = a;
    const big = fitP('NÍVEL 5', SW * 0.7, p * 4);
    stack([
      { s: 'NÍVEL ' + (lvl + 1), p: big, pal: GOLD, gap: p * 4 },
      { s: L.name, p: fitP(L.name, SW * 0.85, p * 2), pal: WHITE, gap: p * 7 },
      { s: L.label, p: fitP(L.label, SW * 0.9, p), pal: LILAC, gap: p * 3 },
      { s: L.newText, p: fitP(L.newText, SW * 0.9, p * 1.3), pal: WHITE, gap: p * 6 },
      { s: L.tip, p: fitP(L.tip, SW * 0.9, p * 1.6), pal: GOLD, gap: 0 },
    ], GGY * GS * 0.45, true);
    sc.globalAlpha = 1;
  } else if (state === 'clear') {
    const L = LEVELS[lvl], nx = LEVELS[lvl + 1];
    const a = stateT < 0.25 ? stateT / 0.25 : stateT > 2.5 ? clamp((2.8 - stateT) / 0.3, 0, 1) : 1;
    sc.globalAlpha = a;
    stack([
      { s: 'NÍVEL ' + (lvl + 1), p: fitP('NÍVEL 5', SW * 0.6, p * 2.4), pal: WHITE, gap: p * 3 },
      { s: 'CONCLUÍDO!', p: fitP('CONCLUÍDO!', SW * 0.85, p * 3), pal: GOLD, gap: p * 6 },
      { s: L.done, p: fitP(L.done, SW * 0.9, p * 1.3), pal: WHITE, gap: p * 4 },
      { s: '+' + clearBonus + ' BÔNUS', p: p, pal: LILAC, gap: p * 4 },
      { s: 'PRÓXIMO: ' + nx.name, p: fitP('PRÓXIMO: ' + nx.name, SW * 0.9, p), pal: LILAC, gap: 0 },
    ], GGY * GS * 0.45, true);
    sc.globalAlpha = 1;
  } else if (state === 'pause') {
    sc.fillStyle = 'rgba(12,7,24,0.65)'; sc.fillRect(0, 0, SW, SH);
    const bp = fitP('SOM: NÃO', SW * 0.45, p * 1.6), minW = textW('CONTINUAR', bp) + bp * 12;
    let y = SH * 0.3;
    TC('PAUSADO', y, fitP('PAUSADO', SW * 0.8, p * 3), GOLD); y += p * 3 * 7 + p * 10;
    ['resume', 'sound', 'menu'].forEach(id => {
      const lab = id === 'resume' ? 'CONTINUAR' : id === 'sound' ? (muted ? 'SOM: NÃO' : 'SOM: SIM') : 'MENU';
      const r = addBtn(id, lab, SW / 2, y + bp * 6.5, bp, { minW, primary: id === 'resume' }); y += r.h + p * 4;
    });
  } else if (state === 'over') {
    sc.fillStyle = 'rgba(12,7,24,0.7)'; sc.fillRect(0, 0, SW, SH);
    let y = stack([
      { s: 'VOCÊ SE DISTRAIU...', p: fitP('VOCÊ SE DISTRAIU...', SW * 0.9, p * 2), pal: GOLD, gap: p * 6 },
      { s: 'TODO MUNDO TROPEÇA.', p: fitP('TODO MUNDO TROPEÇA.', SW * 0.9, p * 1.2), pal: WHITE, gap: p * 3 },
      { s: 'LEVANTA E CONTINUA!', p: fitP('LEVANTA E CONTINUA!', SW * 0.9, p * 1.2), pal: WHITE, gap: 0 },
    ], SH * 0.33, false);
    y += p * 10;
    const bp = fitP('TENTAR DE NOVO', SW * 0.7, p * 1.6), minW = textW('TENTAR DE NOVO', bp) + bp * 10;
    let r = addBtn('retry', 'TENTAR DE NOVO', SW / 2, y + bp * 6.5, bp, { minW, primary: true }); y += r.h + p * 4;
    addBtn('menu', 'MENU', SW / 2, y + bp * 6.5, bp, { minW });
  } else if (state === 'finaleFade') {
    sc.fillStyle = `rgba(0,0,0,${clamp(stateT / 1.0, 0, 1).toFixed(3)})`; sc.fillRect(0, 0, SW, SH);
  } else if (state === 'finale') {
    if (ft > 3 && ft < 13.4) {
      const hp = Math.max(1, Math.floor(FIN.fw / 260));
      sc.globalAlpha = 0.6; TC('TOQUE PARA AVANÇAR', FIN.fy + FIN.fh - hp * 14, hp, LILAC); sc.globalAlpha = 1;
    }
  } else if (state === 'end') {
    const a = clamp(stateT / 0.4, 0, 1);
    sc.globalAlpha = a;
    const side = (SW - FIN.fw) / 2;
    if (side > SW * 0.2) {
      // wide screen: panel beside the scene
      const cx = FIN.fx + FIN.fw + side / 2, q = Math.max(2, Math.min(Math.round(UP * 1.2), Math.floor(side * 0.85 / 80)));
      const pts = 'PONTOS: ' + Math.floor(score);
      let y = SH * 0.36;
      const tc = (s2, yy, pp, pal) => TX(s2, cx - textW(s2, pp) / 2, yy, pp, pal);
      const p1 = fitP('VOCÊ CHEGOU!', side * 0.85, q * 2), p2 = fitP(pts, side * 0.85, q * 1.5);
      const s3 = newRecord ? 'NOVO RECORDE!' : 'DIFICULDADE ' + DIFF[diff].name, p3 = fitP(s3, side * 0.85, q);
      tc('VOCÊ CHEGOU!', y, p1, WHITE); y += p1 * 7 + q * 6;
      tc(pts, y, p2, GOLD); y += p2 * 7 + q * 4;
      tc(s3, y, p3, newRecord ? LILAC : WHITE); y += p3 * 7 + q * 8;
      const minW = textW('JOGAR DE NOVO', q) + q * 10;
      const r = addBtn('again', 'JOGAR DE NOVO', cx, y + q * 6.5, q, { primary: true, minW }); y += r.h + q * 4;
      addBtn('menu', 'MENU', cx, y + q * 6.5, q, { minW });
      sc.globalAlpha = 1;
      return;
    }
    const q = Math.max(2, Math.floor(FIN.fw / 190));
    const y0 = FIN.fy + FIN.fh * 0.79;
    sc.fillStyle = 'rgba(18,10,30,0.82)'; sc.fillRect(FIN.fx, y0, FIN.fw, FIN.fh * 0.21);
    sc.fillStyle = '#e7e100'; sc.fillRect(FIN.fx, y0, FIN.fw, Math.max(2, q >> 1));
    let y = y0 + q * 4;
    const pts = 'PONTOS: ' + Math.floor(score), pp = fitP(pts, FIN.fw * 0.9, q * 1.5);
    TC(pts, y, pp, GOLD); y += pp * 7 + q * 3;
    const sub = newRecord ? 'NOVO RECORDE!  ' + DIFF[diff].name : 'DIFICULDADE ' + DIFF[diff].name;
    TC(sub, y, q, newRecord ? LILAC : WHITE); y += q * 7 + q * 5;
    const bp = q, w1 = textW('JOGAR DE NOVO', bp) + bp * 10, w2 = textW('MENU', bp) + bp * 10;
    if (w1 + w2 + q * 4 < FIN.fw * 0.95) {
      addBtn('again', 'JOGAR DE NOVO', SW / 2 - (w2 + q * 4) / 2, y + bp * 6.5, bp, { primary: true });
      addBtn('menu', 'MENU', SW / 2 + (w1 + q * 4) / 2, y + bp * 6.5, bp);
    } else {
      addBtn('again', 'JOGAR DE NOVO', SW / 2, y + bp * 6.5, bp, { primary: true });
    }
    sc.globalAlpha = 1;
  }
}

// ---------- input ----------
let duckPtr = null; const jumpPtrs = new Set();
const inRect = (x, y, r) => r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function toCanvas(e) { const b = scr.getBoundingClientRect(); return [(e.clientX - b.left) * SW / b.width, (e.clientY - b.top) * SH / b.height]; }
scr.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  const [x, y] = toCanvas(e); pointerX = x; pointerY = y;
  if (e.pointerType !== 'mouse') kbMode = false;
  for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (inRect(x, y, h)) { act(h.id); return; } }
  if (['play', 'intro', 'clear'].includes(state)) {
    if (TOUCH && inRect(x, y, duckRect)) { duckPtr = e.pointerId; input.duck = true; return; }
    jumpPtrs.add(e.pointerId); pressJump();
  } else if (state === 'finale') act('skip');
});
function ptrUp(e) {
  if (e.pointerId === duckPtr) { duckPtr = null; input.duck = false; }
  if (jumpPtrs.delete(e.pointerId) && jumpPtrs.size === 0) releaseJump();
}
scr.addEventListener('pointerup', ptrUp);
scr.addEventListener('pointercancel', ptrUp);
scr.addEventListener('pointermove', e => { const [x, y] = toCanvas(e); if (Math.abs(x - pointerX) + Math.abs(y - pointerY) > 2) kbMode = false; pointerX = x; pointerY = y; });
scr.addEventListener('contextmenu', e => e.preventDefault());
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'], DUCK_KEYS = ['ArrowDown', 'KeyS'];
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k)) e.preventDefault();
  ensureAudio();
  if (k === 'KeyM') { toggleMute(); return; }
  if (['play', 'intro', 'clear'].includes(state)) {
    if (JUMP_KEYS.includes(k) && !e.repeat) pressJump();
    if (DUCK_KEYS.includes(k)) input.duck = true;
    if (k === 'KeyP' || k === 'Escape') act('pause');
    return;
  }
  if (state === 'finale') { if (k === 'Space' || k === 'Enter' || k === 'Escape') act('skip'); return; }
  const nav = hits.filter(h => h.nav);
  if (!nav.length) return;
  if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'Tab') { if (kbMode) kbSel = (kbSel + 1) % nav.length; kbMode = true; }
  else if (k === 'ArrowUp' || k === 'ArrowLeft') { if (kbMode) kbSel = (kbSel - 1 + nav.length) % nav.length; kbMode = true; }
  else if (k === 'Enter' || k === 'Space') { if (!e.repeat) act(nav[clamp(kbMode ? kbSel : 0, 0, nav.length - 1)].id); }
  else if ((k === 'Escape' || k === 'KeyP') && state === 'pause') act('resume');
  else if (state === 'menu' && ['Digit1', 'Digit2', 'Digit3'].includes(k)) act(['facil', 'medio', 'dificil'][+k.slice(-1) - 1]);
});
addEventListener('keyup', e => {
  if (JUMP_KEYS.includes(e.code)) releaseJump();
  if (DUCK_KEYS.includes(e.code)) input.duck = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// ---------- loop ----------
function draw() {
  hits = []; navCount = 0;
  if (state === 'finale' || state === 'end') drawFinale();
  else drawWorld();
  drawUI();
}
let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000) * (window.__speed || 1); last = t;
  update(dt); draw(); musicTick();
  requestAnimationFrame(loop);
}
// test hooks (harmless)
window.__game = {
  get: () => ({ state, lvl, lives, score, dist, levelLen, ft }),
  start: d => startGame(d), level: i => { startLevel(i); }, step: (n, dt) => { for (let i = 0; i < n; i++) update(dt || 1 / 60); draw(); },
  set: o => { if ('state' in o) state = o.state; if ('ft' in o) ft = o.ft; if ('stateT' in o) stateT = o.stateT; if ('dist' in o) dist = o.dist; },
};
requestAnimationFrame(loop);

})();
</script>
